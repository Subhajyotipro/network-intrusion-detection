# Default experiment configuration (CLOSR defaults)
# Paths
data_path: "data/lycos.csv"
data_source: "auto"
results_dir: "results"
weights_dir: "weights"
upstream_dir: "third_party/CLOSR"

# Data
split_seed: 39058032
test_ratio: 0.5
val_ratio: 0.0
sample_thres: 100
drop_cols:
  - "flow_id"
  - "src_addr"
  - "src_port"
  - "dst_addr"
  - "dst_port"
  - "ip_prot"
  - "timestamp"
class_zero: "benign"

# Model & Loss (CLOSR)
model_kind: "closr"
d_in: null
d_out: 64
n_classes: 12
hidden:
  - 1024
  - 1024
  - 1024
dropout: 0.1
residual: false
init: "torch_default"
margin: 1.0
squared: true

# Optimizer & Schedule
batch_size: 4096
weight_decay: 0.0403709
adam_eps: 1.0e-8
lr_init: 1.0e-6
lr_peak: 1.0e-5
lr_final: 1.0e-6
warmup_frac: 0.1
epochs: 200
seed: 1
seeds:
  - 1
  - 2
  - 3
smoke: false
max_batches: null
log_every: 10
checkpoint_every: 0

# Inference & Calibration
scorer: "upstream"
eval_batch_size: 4096
eval_max_rows: 0
grid_size: 200
target_acceptance:
  - 0.95
  - 0.99
f_beta: 1.0
max_known_rejection: 0.05
max_benign_fp: 0.01
siamese_conf_grid: 10
skip_if_confident_benign: false

# Siamese Stage-2
support_mode: "prototype"
k_exemplars: 5

# Benchmarking
warmup_runs: 20
timed_runs: 200
bench_batch_sizes:
  - 1
  - 32
  - 1024

# Visualization
tsne_max_points: 5000
tsne_n_components: 2
tsne_perplexity: 30.0
tsne_early_exaggeration: 12.0
tsne_learning_rate: "auto"
tsne_max_iter: 1000
tsne_n_iter_without_progress: 300
tsne_min_grad_norm: 1.0e-7
tsne_metric: "euclidean"
tsne_init: "pca"
tsne_method: "barnes_hut"
tsne_angle: 0.5
tsne_n_jobs: 1
tsne_verbose: 0
tsne_marker_size: 12.0
tsne_alpha: 0.85
tsne_axis_padding: 0.04
tsne_tiny_group_threshold: 25
tsne_figure_size: [9.0, 7.0]
tsne_colors:
  benign: "#00876c"
  malicious: "#d64b3c"
  zero_day: "#2878b5"

# Device & Determinism
device: "auto"
deterministic: false

